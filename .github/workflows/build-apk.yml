name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: umnaya-tochka-debug-signing-v2
      - name: Prepare explicit debug signing key
        run: |
          mkdir -p .ci
          if [ ! -f .ci/debug.keystore ]; then
            keytool -genkeypair -keystore .ci/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug :monitor:assembleDebug :phone:assembleDebug :sms:assembleDebug :camera:assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Merlin-Launcher-Lite-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            monitor/build/outputs/apk/debug/monitor-debug.apk
            phone/build/outputs/apk/debug/phone-debug.apk
            sms/build/outputs/apk/debug/sms-debug.apk
            camera/build/outputs/apk/debug/camera-debug.apk
          if-no-files-found: error
